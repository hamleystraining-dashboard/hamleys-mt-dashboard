<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamleys MT Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap');
:root {
  --red:#C8102E; --red-dark:#9e0c24; --red-soft:#fce8ec;
  --ink:#111827; --slate:#374151; --muted:#6b7280;
  --border:#e5e7eb; --mist:#f9fafb;
  --green:#15803d; --green-bg:#dcfce7; --green-mid:#22c55e;
  --amber:#b45309; --amber-bg:#fef3c7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--mist);color:var(--ink)}

/* HEADER */
.hdr{background:var(--red);color:#fff;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(200,16,46,.25)}
.hdr-l{display:flex;align-items:center;gap:12px}
.logo{font-family:'DM Serif Display',serif;font-size:20px;letter-spacing:.04em}
.sep{width:1px;height:20px;background:rgba(255,255,255,.3)}
.hdr-title{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hdr-r{font-size:11px;opacity:.65}

/* HERO */
.hero{background:linear-gradient(130deg,#8b0d1e 0%,var(--red) 60%,#e02040 100%);color:#fff;padding:28px 24px}
.hero-eye{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:5px}
.hero-h{font-family:'DM Serif Display',serif;font-size:28px;line-height:1.15;margin-bottom:3px}
.hero-sub{font-size:12px;opacity:.6;margin-bottom:22px}
.kpis{display:flex;gap:24px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi-n{font-size:26px;font-weight:800;line-height:1}
.kpi-l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.55}

/* TABS */
.tabs{background:#fff;border-bottom:2px solid var(--border);display:flex;padding:0 20px;position:sticky;top:54px;z-index:90;overflow-x:auto}
.tab{padding:13px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .12s}
.tab:hover{color:var(--slate)}
.tab.on{color:var(--red);border-bottom-color:var(--red)}

/* MONTH BAR */
.mbar{background:#fff;border-bottom:1px solid var(--border);padding:9px 20px;display:flex;align-items:center;gap:6px;overflow-x:auto}
.mlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-right:4px;white-space:nowrap}
.mc{padding:4px 12px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);background:#fff;white-space:nowrap;transition:all .12s;user-select:none}
.mc:hover:not(.fut){border-color:var(--red);color:var(--red)}
.mc.on{background:var(--red);border-color:var(--red);color:#fff}
.mc.cur{border-color:var(--red);color:var(--red);font-weight:700}
.mc.fut{opacity:.35;cursor:default}

/* PAGE */
.page{max-width:1300px;margin:0 auto;padding:22px 18px 56px}

/* SECTION HEADER */
.sh{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.sh::after{content:'';flex:1;height:1px;background:var(--border)}

/* INDUCTION STRIP */
.ind-strip{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ind-label{font-size:13px;font-weight:700;flex:1}
.ind-sub{font-size:11px;color:var(--muted);margin-top:1px}
.ind-boxes{display:flex;gap:10px;flex-wrap:wrap}
.ind-box{background:var(--mist);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center;min-width:90px}
.ind-box-day{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ind-box-date{font-size:11px;color:var(--slate);margin:2px 0}
.ind-box-val{font-size:15px;font-weight:800}
.ind-box-val.full{color:var(--green)}
.ind-box-val.part{color:var(--amber)}

/* SNAPSHOT STRIP */
.snap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.snap{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.snap-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.snap-n{font-size:26px;font-weight:800;line-height:1}
.snap-d{font-size:11px;color:var(--muted)}
.snap-bar{height:5px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.snap-fill{height:5px;border-radius:3px}

/* TABLE */
.tcard{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:22px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--ink);color:#fff;padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;text-align:left;white-space:nowrap}
th.c,td.c{text-align:center}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--mist)}
td{padding:9px 12px;vertical-align:middle}
.mn{font-weight:700;font-size:12px}
.ms{font-size:10px;color:var(--muted);margin-top:1px}

/* PCT CELL */
.pc{display:flex;flex-direction:column;align-items:center;gap:2px}
.pn{font-size:13px;font-weight:800;line-height:1}
.pb{width:40px;height:4px;background:var(--border);border-radius:2px}
.pf{height:4px;border-radius:2px}
.ps{font-size:9px;color:var(--muted)}
/* colors */
.g{color:var(--green)}.bg{background:var(--green-mid)}
.a{color:var(--amber)}.ba{background:#fbbf24}
.r{color:var(--red)}.br{background:var(--red)}
.c100{color:var(--green)}

/* TICK / CROSS */
.tk{color:var(--green);font-weight:700;font-size:15px}
.xx{color:var(--red);font-size:13px}
.dd{color:var(--muted);font-size:12px}

/* GROUP CARD */
.gc{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.gc-hdr{background:var(--ink);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.gc-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.gc-sub{font-size:11px;opacity:.55;margin-top:2px}
.gc-pct{font-size:22px;font-weight:800}
.chip-rm{font-size:10px;font-weight:700;background:#dbeafe;color:#1d4ed8;padding:2px 7px;border-radius:4px}
.chip-rom{font-size:10px;font-weight:700;background:#ede9fe;color:#7c3aed;padding:2px 7px;border-radius:4px}

/* PHASE CHIP */
.ph{font-size:10px;font-weight:700;background:var(--red-soft);color:var(--red-dark);padding:2px 7px;border-radius:4px}

/* LAST UPDATED */
.lu{font-size:11px;color:var(--muted);text-align:right;margin-top:12px}

@media(max-width:640px){
  .hero{padding:20px 16px}.hero-h{font-size:22px}
  .page{padding:14px 12px 48px}
  .kpis{gap:16px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <span class="logo">HAMLEYS</span>
    <div class="sep"></div>
    <span class="hdr-title">MT Program Dashboard</span>
  </div>
  <span class="hdr-r" id="hdrDate"></span>
</header>

<div class="hero">
  <div class="hero-eye">Cohort 1 · DySM Management Trainee Track · Start: 11 Jun 2026</div>
  <div class="hero-h">Program Compliance</div>
  <div class="hero-sub">10 months · 3 phases · 12 MTs · Monthly compliance view</div>
  <div class="kpis">
    <div class="kpi"><span class="kpi-n" id="k0">12</span><span class="kpi-l">Active MTs</span></div>
    <div class="kpi"><span class="kpi-n" id="k1">—</span><span class="kpi-l">Current Month</span></div>
    <div class="kpi"><span class="kpi-n" id="k2">—</span><span class="kpi-l">Cohort Compliance</span></div>
    <div class="kpi"><span class="kpi-n" id="k3">—</span><span class="kpi-l">Induction Done</span></div>
    <div class="kpi"><span class="kpi-n" id="k4">—</span><span class="kpi-l">100% This Month</span></div>
  </div>
</div>

<div class="tabs" id="tabBar">
  <div class="tab on" onclick="setTab('overview',this)">Overview</div>
  <div class="tab" onclick="setTab('rom',this)">ROM View</div>
  <div class="tab" onclick="setTab('rm',this)">RM View</div>
  <div class="tab" onclick="setTab('journey',this)">Full Journey</div>
</div>

<div class="mbar" id="mbar"></div>
<div class="page" id="page"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────
const KEY = 'hamleys_mt_data_v3';

const MONTHS = [
  {m:1,  label:'June',      journal:4, viltIdx:0,    qtest:'',   scorecard:false, fcTarget:2},
  {m:2,  label:'July',      journal:4, viltIdx:1,    qtest:'',   scorecard:false, fcTarget:4},
  {m:3,  label:'August',    journal:5, viltIdx:2,    qtest:'q1', scorecard:true,  fcTarget:6},
  {m:4,  label:'September', journal:4, viltIdx:3,    qtest:'',   scorecard:false, fcTarget:6},
  {m:5,  label:'October',   journal:4, viltIdx:4,    qtest:'',   scorecard:false, fcTarget:6},
  {m:6,  label:'November',  journal:4, viltIdx:5,    qtest:'q2', scorecard:true,  fcTarget:6},
  {m:7,  label:'December',  journal:4, viltIdx:6,    qtest:'',   scorecard:false, fcTarget:6},
  {m:8,  label:'January',   journal:4, viltIdx:7,    qtest:'',   scorecard:false, fcTarget:6},
  {m:9,  label:'February',  journal:4, viltIdx:8,    qtest:'q3', scorecard:false, fcTarget:6},
  {m:10, label:'March',     journal:4, viltIdx:null, qtest:'q4', scorecard:true,  fcTarget:6},
];

const DEFAULT_VILTS = [
  'M1: Operations — Audit-Ready Standards',
  'M2: Product — Reading the Range',
  'M3: B&M — Inventory Optimisation',
  'M4: VM — Commercial Logic of Presentation',
  "M5: Marketing — Local Marketing",
  "M6: Finance — Your Store's P&L",
  'M7: HR — People Decisions',
  'M8: E-Comm — Beyond the Shop Floor',
  "M9: B2B — Corporate Revenue",
];

const BASE_MTS = [
  {id:1,  name:'Vaishnavi Nigam',      store:'Ham.PalladiumFF',  code:'TB2O', sd:'Almas Zaidi',      rom:'Shirish Mastud',   rm:'Yogesh'},
  {id:2,  name:'Devesh Chaturvedi',    store:'Ham.Pldum.Play',   code:'T77X', sd:'Virendra Rahevar', rom:'Shirish Mastud',   rm:'Yogesh'},
  {id:3,  name:'Mahee Srivastava',     store:'Ham.SarathCity',   code:'THP5', sd:'Ashlin Moses',     rom:'Ashlin Moses',     rm:'Bipro'},
  {id:4,  name:'Ankit Bhola',          store:'Ham.Elante',       code:'THE1', sd:'Harsh Sharma',     rom:'Ajay Gill',        rm:'Bipro'},
  {id:5,  name:'Anushka Pankaj Dutta', store:'Ham.Southcty',     code:'THR3', sd:'Manmohan',         rom:'Chetan Chaudhari', rm:'Yogesh'},
  {id:6,  name:'Sameer Raj',           store:'Ham.AVKDel',       code:'THE8', sd:'Ajay Gill',        rom:'Ajay Gill',        rm:'Bipro'},
  {id:7,  name:'Shrishti Duboliya',    store:'Ham.PMC',          code:'THF0', sd:'Damodharan',       rom:'Divya Lakshmi',    rm:'Yogesh'},
  {id:8,  name:'Anannya Tripathi',     store:'Ham.Jaipur',       code:'THI7', sd:'Ajay Gill',        rom:'Ajay Gill',        rm:'Bipro'},
  {id:9,  name:'Juber Parvez',         store:'Ham. DelhiT1D',    code:'T0ZV', sd:'Khubaib',          rom:'Lalit Mohan',      rm:'Bipro'},
  {id:10, name:'Kartik Kiran Ranade',  store:'Ham.MOM',          code:'T2UO', sd:'Subodh',           rom:'Chetan Chaudhari', rm:'Yogesh'},
  {id:11, name:'Kashish Gangwani',     store:'Ham.Noida',        code:'THS8', sd:'Ashish Juyal',     rom:'Lalit Mohan',      rm:'Bipro'},
  {id:12, name:'Jatin Thakur',         store:'Ham.Phoenix',      code:'THE0', sd:'Harnest',          rom:'Ashlin Moses',     rm:'Bipro'},
];

// ─── LOAD DATA ────────────────────────────────────────────────────
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      BASE_MTS.forEach(mt => {
        if (!d.mts.find(m => m.id === mt.id)) d.mts.push({...mt});
        if (!d.tracking[mt.id]) d.tracking[mt.id] = blank();
        while (d.tracking[mt.id].months.length < 10)
          d.tracking[mt.id].months.push({journalWeeks:0,rmCheckin:false,ldCheckin:false,viltAttended:false,qtestScore:null,scorecardDone:false,fcCertsDone:0});
      });
      if (!d.viltNames || d.viltNames.length < 9) d.viltNames = [...DEFAULT_VILTS];
      return d;
    }
  } catch(e) {}
  const d = {mts: BASE_MTS.map(m=>({...m})), tracking:{}, viltNames:[...DEFAULT_VILTS]};
  BASE_MTS.forEach(mt => d.tracking[mt.id] = blank());
  return d;
}

function blank() {
  return {inductionDay1:false,inductionDay2:false,
    months:Array.from({length:10},()=>({journalWeeks:0,rmCheckin:false,ldCheckin:false,viltAttended:false,qtestScore:null,scorecardDone:false,fcCertsDone:0})),
    notes:'',lastUpdated:null};
}

// ─── HELPERS ──────────────────────────────────────────────────────
function curIdx() {
  const now = new Date();
  const map = ['2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12','2027-01','2027-02','2027-03'];
  const k = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const i = map.indexOf(k);
  return i < 0 ? 0 : i;
}

function monthComp(id, mi) {
  const t = D.tracking[id]; const p = MONTHS[mi]; const md = t.months[mi];
  if (!md) return {pct:0,done:0,total:0,items:{}};
  let done=0, total=0; const items={};
  total += p.journal; const jd = Math.min(md.journalWeeks, p.journal);
  done += jd; items.journal={done:jd,total:p.journal};
  total += 2; const cd=(md.rmCheckin?1:0)+(md.ldCheckin?1:0);
  done += cd; items.ci={done:cd,total:2};
  if (p.viltIdx!==null){total++;if(md.viltAttended)done++;items.vilt={done:md.viltAttended?1:0,total:1};}
  if (p.qtest){total++;const qp=md.qtestScore!==null&&md.qtestScore>=80?1:0;done+=qp;items.qtest={done:qp,total:1,score:md.qtestScore};}
  if (p.scorecard){total++;if(md.scorecardDone)done++;items.sc={done:md.scorecardDone?1:0,total:1};}
  if (mi<=2){const prevT=mi>0?MONTHS[mi-1].fcTarget:0;const thisT=p.fcTarget-prevT;const thisDone=Math.min(md.fcCertsDone,p.fcTarget)-(mi>0?Math.min(t.months[mi-1].fcCertsDone||0,MONTHS[mi-1].fcTarget):0);done+=Math.min(Math.max(0,thisDone),thisT);total+=thisT;items.fc={done:md.fcCertsDone,total:p.fcTarget};}
  return {pct:total>0?Math.round((done/total)*100):0,done,total,items};
}

function ovComp(id) {
  const t = D.tracking[id]; if(!t) return 0;
  let done=2+(t.inductionDay1?1:0)+(t.inductionDay2?1:0)-2, total=2;
  done = (t.inductionDay1?1:0)+(t.inductionDay2?1:0); 
  for(let i=0;i<=CUR;i++){const c=monthComp(id,i);done+=c.done;total+=c.total;}
  return total>0?Math.round((done/total)*100):0;
}

function cl(p){return p===100?'g':p>=70?'g':p>=40?'a':'r'}
function bf(p){return p===100?'bg':p>=70?'bg':p>=40?'ba':'br'}

function pctCell(val,total){
  if(total===0) return '<td class="c"><span class="dd">—</span></td>';
  const p=Math.round((val/total)*100);
  return `<td class="c"><div class="pc"><span class="pn ${cl(p)}">${p}%</span><div class="pb"><div class="pf ${bf(p)}" style="width:${p}%"></div></div><span class="ps">${val}/${total}</span></div></td>`;
}

// ─── STATE ────────────────────────────────────────────────────────
let D = load();
const CUR = curIdx();
let selMonth = CUR;
let activeTab = 'overview';

// ─── HERO ─────────────────────────────────────────────────────────
function updateHero() {
  const mts = D.mts;
  const indDone = mts.filter(m=>D.tracking[m.id]?.inductionDay1&&D.tracking[m.id]?.inductionDay2).length;
  const avgs = mts.map(m=>ovComp(m.id));
  const avg = Math.round(avgs.reduce((a,b)=>a+b,0)/mts.length);
  const full100 = mts.filter(m=>monthComp(m.id,selMonth).pct===100).length;
  document.getElementById('k1').textContent = MONTHS[CUR].label+' (M'+(CUR+1)+')';
  document.getElementById('k2').textContent = avg+'%';
  document.getElementById('k3').textContent = indDone+'/12';
  document.getElementById('k4').textContent = full100+'/12';
}

// ─── MONTH BAR ────────────────────────────────────────────────────
function buildMbar() {
  document.getElementById('mbar').innerHTML = '<span class="mlbl">Month</span>' +
    MONTHS.map((mp,i) => {
      const fut = i > CUR, cur = i === CUR, sel = i === selMonth;
      let cls = 'mc' + (sel?' on':'') + (!sel&&cur?' cur':'') + (fut?' fut':'');
      return `<div class="${cls}" ${fut?'':('onclick="selM('+i+')"')}>M${mp.m} ${mp.label}</div>`;
    }).join('');
}

function selM(i) { selMonth=i; buildMbar(); render(); }

// ─── TABS ─────────────────────────────────────────────────────────
function setTab(name, el) {
  activeTab = name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  render();
}

// ─── INDUCTION STRIP ─────────────────────────────────────────────
function indStrip() {
  const mts = D.mts;
  const d1 = mts.filter(m=>D.tracking[m.id]?.inductionDay1).length;
  const d2 = mts.filter(m=>D.tracking[m.id]?.inductionDay2).length;
  const c1 = d1===12?'full':d1>0?'part':'part';
  const c2 = d2===12?'full':d2>0?'part':'part';
  return `<div class="ind-strip">
    <div><div class="ind-label">🎓 HO Induction — Pre-Program</div><div class="ind-sub">Day 1: L&D &amp; HR (11 Jun) · Day 2: Function Heads (12 Jun)</div></div>
    <div class="ind-boxes">
      <div class="ind-box"><div class="ind-box-day">Day 1</div><div class="ind-box-date">11 Jun</div><div class="ind-box-val ${c1}">${d1}/12</div></div>
      <div class="ind-box"><div class="ind-box-day">Day 2</div><div class="ind-box-date">12 Jun</div><div class="ind-box-val ${c2}">${d2}/12</div></div>
    </div>
  </div>`;
}

// ─── OVERVIEW ─────────────────────────────────────────────────────
function renderOverview() {
  const p = MONTHS[selMonth];
  const mts = D.mts;
  const vName = p.viltIdx!==null ? D.viltNames[p.viltIdx] : null;

  // Snapshot
  let jD=0,jT=0,cD=0,cT=0,vD=0,vT=0,qD=0,qT=0,sD=0,sT=0;
  mts.forEach(m=>{
    const c=monthComp(m.id,selMonth);
    jD+=c.items.journal?.done||0; jT+=c.items.journal?.total||0;
    cD+=c.items.ci?.done||0; cT+=c.items.ci?.total||0;
    if(c.items.vilt){vD+=c.items.vilt.done;vT+=c.items.vilt.total;}
    if(c.items.qtest){qD+=c.items.qtest.done;qT+=c.items.qtest.total;}
    if(c.items.sc){sD+=c.items.sc.done;sT+=c.items.sc.total;}
  });

  function snap(lbl,d,t,icon){
    if(!t) return '';
    const pct=Math.round((d/t)*100);
    return `<div class="snap"><div class="snap-lbl">${icon} ${lbl}</div><div><span class="snap-n">${d}</span><span class="snap-d"> / ${t}</span></div><div class="snap-bar"><div class="snap-fill ${bf(pct)}" style="width:${pct}%"></div></div><div class="snap-d" style="margin-top:4px">${pct}% complete</div></div>`;
  }

  const snaps = `<div class="snap-grid">
    ${snap('Journal',jD,jT,'📓')}
    ${snap('Check-ins',cD,cT,'🤝')}
    ${vT?snap('VILT',vD,vT,'🎓'):''}
    ${qT?snap('Q Test',qD,qT,'💻'):''}
    ${sT?snap('Scorecard',sD,sT,'📋'):''}
  </div>`;

  // Table
  const rows = mts.map(m=>{
    const t=D.tracking[m.id]; const md=t.months[selMonth];
    const c=monthComp(m.id,selMonth); const ov=ovComp(m.id);
    const phase=selMonth<=2?1:selMonth<=5?2:3;
    return `<tr>
      <td><div class="mn">${m.name}</div><div class="ms">${m.code}</div></td>
      <td><div style="font-size:11px;font-weight:500">${m.store}</div></td>
      <td class="c"><span class="ph">Ph ${phase}</span></td>
      ${pctCell(c.items.journal?.done||0, c.items.journal?.total||0)}
      ${pctCell(c.items.ci?.done||0, c.items.ci?.total||0)}
      ${p.viltIdx!==null?`<td class="c">${md.viltAttended?'<span class="tk">✓</span>':'<span class="xx">✗</span>'}</td>`:''}
      ${selMonth<=2?pctCell(md.fcCertsDone,p.fcTarget):''}
      ${p.qtest?`<td class="c">${md.qtestScore===null?'<span class="dd">—</span>':md.qtestScore>=80?`<span class="g" style="font-weight:700">${md.qtestScore}%</span>`:`<span class="r" style="font-weight:700">${md.qtestScore}%</span>`}</td>`:''}
      ${p.scorecard?`<td class="c">${md.scorecardDone?'<span class="tk">✓</span>':'<span class="xx">✗</span>'}</td>`:''}
      <td class="c"><span class="pn ${cl(c.pct)}" style="font-size:15px">${c.pct}%</span></td>
      <td class="c"><span class="pn ${cl(ov)}" style="font-size:15px">${ov}%</span></td>
    </tr>`;
  }).join('');

  const extraCols = (p.viltIdx!==null?'<th class="c">VILT</th>':'') +
    (selMonth<=2?'<th class="c">FC Certs</th>':'') +
    (p.qtest?`<th class="c">${p.qtest.toUpperCase()} Test</th>`:'') +
    (p.scorecard?'<th class="c">Scorecard</th>':'');

  return `${indStrip()}
    <div class="sh">M${p.m} ${p.label} — Cohort Snapshot</div>
    ${snaps}
    <div class="sh">Compliance Table — ${p.label}${vName?` <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted)">· VILT: ${vName}</span>`:''}</div>
    <div class="tcard"><div class="tw">
      <table>
        <thead><tr>
          <th>MT</th><th>Store</th><th class="c">Phase</th>
          <th class="c">Journal<br><span style="font-size:9px;opacity:.7">${p.journal} wks</span></th>
          <th class="c">Check-ins<br><span style="font-size:9px;opacity:.7">RM+L&D</span></th>
          ${extraCols}
          <th class="c">Month %</th><th class="c">Overall %</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div></div>`;
}

// ─── ROM VIEW ─────────────────────────────────────────────────────
function renderROM() {
  const p = MONTHS[selMonth];
  const roms = [...new Set(D.mts.map(m=>m.rom))].sort();
  return `${indStrip()}<div class="sh">ROM View — ${p.label}</div>` +
    roms.map(rom=>{
      const mts=D.mts.filter(m=>m.rom===rom);
      const avg=Math.round(mts.reduce((s,m)=>s+ovComp(m.id),0)/mts.length);
      const mAvg=Math.round(mts.reduce((s,m)=>s+monthComp(m.id,selMonth).pct,0)/mts.length);
      const rows=mts.map(m=>{
        const md=D.tracking[m.id].months[selMonth];
        const c=monthComp(m.id,selMonth); const ov=ovComp(m.id);
        return `<tr>
          <td><div class="mn">${m.name}</div><div class="ms">${m.store}</div></td>
          <td><span class="chip-rm">${m.rm}</span></td>
          ${pctCell(c.items.journal?.done||0,c.items.journal?.total||0)}
          ${pctCell(c.items.ci?.done||0,c.items.ci?.total||0)}
          <td class="c">${p.viltIdx!==null?(md.viltAttended?'<span class="tk">✓</span>':'<span class="xx">✗</span>'):'<span class="dd">—</span>'}</td>
          <td class="c"><span class="pn ${cl(c.pct)}">${c.pct}%</span></td>
          <td class="c"><span class="pn ${cl(ov)}">${ov}%</span></td>
        </tr>`;
      }).join('');
      return `<div class="gc"><div class="gc-hdr">
        <div><div class="gc-name">${rom} <span class="chip-rom">ROM</span></div><div class="gc-sub">${mts.length} MTs · ${p.label}: ${mAvg}% avg</div></div>
        <div style="text-align:right"><div style="font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.08em">Overall</div><div class="gc-pct">${avg}%</div></div>
      </div><div style="overflow-x:auto"><table>
        <thead><tr><th>MT</th><th>RM</th><th class="c">Journal</th><th class="c">Check-ins</th><th class="c">VILT</th><th class="c">Month %</th><th class="c">Overall %</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>`;
    }).join('');
}

// ─── RM VIEW ──────────────────────────────────────────────────────
function renderRM() {
  const p = MONTHS[selMonth];
  const rms = [...new Set(D.mts.map(m=>m.rm))].sort();
  return `${indStrip()}<div class="sh">RM View — ${p.label}</div>` +
    rms.map(rm=>{
      const mts=D.mts.filter(m=>m.rm===rm);
      const avg=Math.round(mts.reduce((s,m)=>s+ovComp(m.id),0)/mts.length);
      const mAvg=Math.round(mts.reduce((s,m)=>s+monthComp(m.id,selMonth).pct,0)/mts.length);
      const rows=mts.map(m=>{
        const t=D.tracking[m.id]; const md=t.months[selMonth];
        const c=monthComp(m.id,selMonth); const ov=ovComp(m.id);
        const indOk=t.inductionDay1&&t.inductionDay2;
        return `<tr>
          <td><div class="mn">${m.name}</div><div class="ms">${m.store}</div></td>
          <td><span class="chip-rom">${m.rom}</span></td>
          <td class="c">${indOk?'<span class="tk">✓</span>':'<span class="xx">✗</span>'}</td>
          ${pctCell(c.items.journal?.done||0,c.items.journal?.total||0)}
          ${pctCell(c.items.ci?.done||0,c.items.ci?.total||0)}
          <td class="c">${p.viltIdx!==null?(md.viltAttended?'<span class="tk">✓</span>':'<span class="xx">✗</span>'):'<span class="dd">—</span>'}</td>
          ${p.qtest?`<td class="c">${md.qtestScore===null?'<span class="dd">—</span>':md.qtestScore>=80?`<span class="g" style="font-weight:700">${md.qtestScore}%</span>`:`<span class="r" style="font-weight:700">${md.qtestScore}%</span>`}</td>`:''}
          <td class="c"><span class="pn ${cl(c.pct)}">${c.pct}%</span></td>
          <td class="c"><span class="pn ${cl(ov)}">${ov}%</span></td>
        </tr>`;
      }).join('');
      const qHead=p.qtest?`<th class="c">Q Test</th>`:'';
      return `<div class="gc"><div class="gc-hdr">
        <div><div class="gc-name">${rm} <span class="chip-rm">RM</span></div><div class="gc-sub">${mts.length} MTs · ${p.label}: ${mAvg}% avg</div></div>
        <div style="text-align:right"><div style="font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.08em">Overall</div><div class="gc-pct">${avg}%</div></div>
      </div><div style="overflow-x:auto"><table>
        <thead><tr><th>MT</th><th>ROM</th><th class="c">Induction</th><th class="c">Journal</th><th class="c">Check-ins</th><th class="c">VILT</th>${qHead}<th class="c">Month %</th><th class="c">Overall %</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>`;
    }).join('');
}

// ─── FULL JOURNEY ────────────────────────────────────────────────
function renderJourney() {
  return `<div class="sh">Full 10-Month Journey — All MTs</div>` +
    D.mts.map(m=>{
      const t=D.tracking[m.id]; const ov=ovComp(m.id);
      const monthCells=MONTHS.map((_,i)=>{
        if(i>CUR) return '<td class="c"><span class="dd" style="font-size:10px">—</span></td>';
        const c=monthComp(m.id,i);
        return `<td class="c"><div class="pc"><span class="pn ${cl(c.pct)}" style="font-size:12px">${c.pct}%</span><div class="pb"><div class="pf ${bf(c.pct)}" style="width:${c.pct}%"></div></div></div></td>`;
      }).join('');
      return `<div class="gc" style="margin-bottom:14px">
        <div class="gc-hdr">
          <div><div class="gc-name">${m.name}</div><div class="gc-sub">${m.store} · ROM: ${m.rom} · RM: ${m.rm}</div></div>
          <div style="text-align:right"><div style="font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.08em">Overall</div><div class="gc-pct">${ov}%</div></div>
        </div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>Element</th>${MONTHS.map(mp=>`<th class="c" style="min-width:56px">M${mp.m}<br><span style="font-size:9px;opacity:.6">${mp.label.slice(0,3)}</span></th>`).join('')}</tr></thead>
          <tbody>
            <tr><td style="font-size:11px;font-weight:600;color:var(--slate)">📓 Journal</td>${MONTHS.map((_,i)=>i>CUR?'<td class="c"><span class="dd">—</span></td>':pctCell(Math.min(t.months[i].journalWeeks,MONTHS[i].journal),MONTHS[i].journal)).join('')}</tr>
            <tr><td style="font-size:11px;font-weight:600;color:var(--slate)">🤝 Check-ins</td>${MONTHS.map((_,i)=>{if(i>CUR)return'<td class="c"><span class="dd">—</span></td>';const d=(t.months[i].rmCheckin?1:0)+(t.months[i].ldCheckin?1:0);return pctCell(d,2);}).join('')}</tr>
            <tr><td style="font-size:11px;font-weight:600;color:var(--slate)">🎓 VILT</td>${MONTHS.map((p,i)=>{if(p.viltIdx===null||i>CUR)return'<td class="c"><span class="dd">—</span></td>';return`<td class="c">${t.months[i].viltAttended?'<span class="tk">✓</span>':'<span class="xx">✗</span>'}</td>`;}).join('')}</tr>
            <tr><td style="font-size:11px;font-weight:600;color:var(--slate)">💻 Q Test</td>${MONTHS.map((p,i)=>{if(!p.qtest||i>CUR)return'<td class="c"><span class="dd">—</span></td>';const s=t.months[i].qtestScore;return`<td class="c">${s===null?'<span class="dd">—</span>':s>=80?`<span class="g" style="font-weight:700;font-size:11px">${s}%</span>`:`<span class="r" style="font-weight:700;font-size:11px">${s}%</span>`}</td>`;}).join('')}</tr>
          </tbody>
        </table></div>
      </div>`;
    }).join('');
}

// ─── RENDER ───────────────────────────────────────────────────────
function render() {
  D = load();
  updateHero();
  buildMbar();
  let html = '';
  if (activeTab==='overview') html=renderOverview();
  else if (activeTab==='rom') html=renderROM();
  else if (activeTab==='rm') html=renderRM();
  else html=renderJourney();

  const lu = D.mts.reduce((l,m)=>{const t=D.tracking[m.id];return t?.lastUpdated>l?t.lastUpdated:l;},'');
  html += `<div class="lu">${lu?'Last updated: '+new Date(lu).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'No data entered yet — open admin panel to begin.'}</div>`;
  document.getElementById('page').innerHTML = html;
}

// ─── INIT ──────────────────────────────────────────────────────────
document.getElementById('hdrDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
window.addEventListener('storage', e => { if (e.key === KEY) render(); });
render();
</script>
</body>
</html>
